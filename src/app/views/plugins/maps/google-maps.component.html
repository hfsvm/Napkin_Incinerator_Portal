<div class="refresh-circle">
  <span class="time">{{ formattedRefreshTime }}</span>
</div>

<div class="container-fluid ultra-advanced-map-ui">
  <div *ngIf="errorMessage" class="alert alert-danger text-center">
    {{ errorMessage }}
  </div>

  <div class="row">
    <div class="col-lg-4 col-md-4 col-sm-12 filter-column">
      <div class="filter-container p-3 shadow-lg rounded bg-white">
        <div class="position-relative mb-3" style="min-height: 32px">
          <div class="d-flex justify-content-center align-items-center">
            <i class="fas fa-filter me-2"></i>
            <span class="fw-bold" style="font-size: 1.3rem">Smart Filters</span>
            <button class="btn btn-sm btn-light ms-2 p-1" (click)="toggleFilterPanel()" title="Toggle Filters">
              <i class="fas" [ngClass]="{'fa-chevron-down': !filterPanelOpen, 'fa-chevron-up': filterPanelOpen}" style="font-size: 0.6rem"></i>
            </button>
          </div>
          <div class="d-flex justify-content-center align-items-center my-3 gap-2 flex-wrap">
            <input type="text" class="form-control" [(ngModel)]="searchTextMain" placeholder="Enter MachineId, McSrNo, UID" style="width: 200px; font-size: 0.85rem; padding: 0.25rem 0.5rem" />
            <button class="btn btn-primary btn-sm" (click)="searchMachine()">Search Machine</button>
          </div>
          <div class="position-absolute end-0 top-0">
            <i class="fas fa-sync-alt text-danger" style="cursor: pointer; font-size: 1.3rem" (click)="refreshFilters()" title="Refresh Filters"></i>
          </div>
        </div>

        <div *ngIf="filterPanelOpen">
          <form>
            <div class="card-body">
              <div class="container">
                
                <!-- ========== SSA USER LAYOUT (Side by Side - 8 Filters, No Stock Status) ========== -->
                <ng-container *ngIf="isSSALogin(); else nonSSALayout">
                  
                  <!-- Row 1: Client Name & Machine Status -->
                  <div class="row mb-3">
                    <div class="col-md-6 mb-2">
                      <label><strong>Client Name</strong></label>
                      <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle w-100 text-start" type="button" (click)="toggleDropdown('projects')">
                          {{ selectedProjects.length ? "Selected (" + selectedProjects.length + ")" : "Client Name" }}
                        </button>
                        <div class="dropdown-menu show" *ngIf="dropdownOpen['projects']" style="max-height: 300px; overflow-y: auto;">
                          <div style="padding: 6px; position: sticky; top: 0; background: white;">
                            <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText['projects']" (click)="$event.stopPropagation()" />
                          </div>
                          <label class="dropdown-item d-flex align-items-center" style="gap: 6px">
                            <input type="checkbox" [checked]="selectedProjects.length === projects.length && projects.length > 0" (change)="toggleSelectAll(selectedProjects, projects, 'projects')" />
                            <strong style="margin: 0">Select All</strong>
                          </label>
                          <label *ngFor="let option of projects | filterDropdown : searchText['projects']" class="dropdown-item">
                            <input type="checkbox" [checked]="selectedProjects.includes(option.ProjectId)" (change)="toggleSelection(selectedProjects, option.ProjectId, 'projects')" />
                            {{ option.projectname }}
                          </label>
                        </div>
                      </div>
                    </div>
                    <div class="col-md-6 mb-2">
                      <label><strong>Machine Status</strong></label>
                      <div class="dropdown">

                          {{ selectedMachineStatuses.length ? "Selected (" + selectedMachineStatuses.length + ")" : "Machine Status" }}

                        <div class="dropdown-menu show" *ngIf="dropdownOpen['machineStatuses']" style="max-height: 300px; overflow-y: auto;">
                          <label class="dropdown-item d-flex align-items-center" style="gap: 6px">
                            <input type="checkbox" [checked]="selectedMachineStatuses.length === machineStatuses.length && machineStatuses.length > 0" (change)="toggleSelectAll(selectedMachineStatuses, machineStatuses, 'machineStatuses')" />

                          {{ selectedBeats.length ? "Selected (" + selectedBeats.length + ")" : "Machines" }}
                        </button>
                        <div class="dropdown-menu show" *ngIf="dropdownOpen['beats']" style="max-height: 300px; overflow-y: auto;">
                          <div style="padding: 6px; position: sticky; top: 0; background: white;">
                            <input type="text" class="form-control" placeholder="Search..." [(ngModel)]="searchText['beats']" (click)="$event.stopPropagation()" />
                          </div>
                          <label class="dropdown-item d-flex align-items-center" style="gap: 6px">
                            <input type="checkbox" [checked]="selectedBeats.length === beats.length && beats.length > 0" (change)="toggleSelectAll(selectedBeats, beats, 'beats')" />
                            <strong style="margin: 0">Select All</strong>
                          </label>
                          <label *ngFor="let option of beats | filterDropdown : searchText['beats']" class="dropdown-item">
                            <input type="checkbox" [checked]="selectedBeats.includes(option)" (change)="toggleSelection(selectedBeats, option, 'beats')" />
                            {{ option }}
                          </label>
                        </div>
                      </div>
                    </div>
                  </div>

                </ng-template>

              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="col-lg-8 col-md-8 col-sm-12 map-column">
      <div class="map-container shadow-lg rounded">
        <div id="map" style="width: 100%; height: 650px"></div>
        <div class="zoom-controls">
          <button (click)="zoomIn()">＋</button>
          <button (click)="zoomOut()">－</button>
        </div>
      </div>

      <!-- Radio button controls -->
      <div class="map-controls bg-white p-3 mt-3 rounded shadow">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="mapViewOptions" id="radioMachine" value="machine" [(ngModel)]="selectedMapView" (change)="changeMapView('machine')" />
          <label class="form-check-label" for="radioMachine">Machines</label>
        </div>

        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="mapViewOptions" id="radioZone" value="zone" [(ngModel)]="selectedMapView" (change)="changeMapView('zone')" />
          <label class="form-check-label" for="radioZone">{{ getZoneLabel() }}</label>
        </div>

        <!-- Only show Ward radio button for non-SSA users -->
        <div class="form-check form-check-inline" *ngIf="!isSSALogin()">
          <input class="form-check-input" type="radio" name="mapViewOptions" id="radioWard" value="ward" [(ngModel)]="selectedMapView" (change)="changeMapView('ward')" />
          <label class="form-check-label" for="radioWard">{{ getWardLabel() }}</label>
        </div>

        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="mapViewOptions" id="radioBeat" value="beat" [(ngModel)]="selectedMapView" (change)="changeMapView('beat')" />
          <label class="form-check-label" for="radioBeat">{{ getBeatLabel() }}</label>
        </div>

        <div class="d-flex justify-content-center flex-wrap gap-2">
          <a class="btn btn-outline-primary" [routerLink]="['/graph-dashboard']" [queryParams]="{ zone: zones1 | json }" target="_blank" rel="noopener noreferrer">Graphs</a>

          <ng-container *ngIf="zones1.length > 0; else loadingZones">
            <a *ngFor="let zone of zones1" class="btn btn-outline-primary" [routerLink]="['/zone-dashboard']" [queryParams]="{ zone: zone }" target="_blank" rel="noopener noreferrer">{{ zone }}</a>
          </ng-container>

          <ng-template #loadingZones>
            <span class="text-muted">Loading zones...</span>
          </ng-template>
        </div>
      </div>
    </div>
  </div>
</div>
